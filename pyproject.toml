[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "driftlens-docs"
version = "0.1.0"
description = "Evidence-linked Python documentation drift detection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/naitik2004/driftlens"
Repository = "https://github.com/naitik2004/driftlens"
Issues = "https://github.com/naitik2004/driftlens/issues"

[project.scripts]
driftlens = "driftlens.cli:main"

[tool.setuptools.packages.find]
include = ["driftlens*"]
