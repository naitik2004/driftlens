name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - run: python -m examples.demo
      - run: python -m pip install --no-deps .
      - run: driftlens --help
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Verify installed CLI outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/installed-cli"
          "$RUNNER_TEMP/installed-cli/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/installed-cli/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed-cli/bin/python" -I "$GITHUB_WORKSPACE/examples/verify_install.py"
